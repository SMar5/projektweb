name: CI
on:
  pull_request:
    branches: [master, production]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Do production wolno mergowac tylko master
        if: github.base_ref == 'production' && github.head_ref != 'master'
        run: |
          echo "Do galezi production mozna mergowac wylacznie master."
          exit 1
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nforum
          ports: [ "5432:5432" ]
          options: >
            --health-cmd "pg_isready -U postgres"
            --health-interval 5s --health-timeout 5s --health-retries 10
          env:
            SECRET_KEY: ci-only-not-a-secret
            DEBUG: "False"
            DATABASE_NAME: nforum
            DATABASE_USER: postgres
            DATABASE_PASSWORD: postgres
            DATABASE_HOST: localhost
            DATABASE_PORT: "5432"
            DATABASE_SSLMODE: disable
          defaults:
            run:
              working-directory: app
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.9"
                cache: pip
                cache-dependency-path: app/requirements.txt
            - run: pip install -r requirements.txt
            - run: python manage.py check
            - run: python manage.py makemigrations --check --dry-run
            - run: python manage.py migrate --noinput
            - run: python manage.py collectstatic --noinput
            - run: python manage.py test
